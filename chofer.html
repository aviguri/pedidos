<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reparto · AVIGURI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Página del chofer: la hoja de ruta de un camión, con un botón por cliente para ir con Google Maps y marcar la entrega.
   Entra con el token del link (#t=…), sin usuario. Las marcas se ven en el Ruteo de la oficina en unos segundos. */
:root{--verde:#026937;--verde-osc:#01441f;--verde-claro:#4a9b6e;--amarillo:#F6C65B;--bg:#f4f6f4;--surface:#fff;--surface-2:#f0f4f1;--fg:#1a1a1a;--muted:#5d6b62;--line:#dde5df;
  --ok:#01441f;--ok-soft:#d4e8dc;--danger:#8a2020;--danger-soft:#fbe3e3;--warn:#8a5d15;--warn-soft:#fdf0d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111714;--surface:#1a221d;--surface-2:#20302a;--fg:#eef2ef;--muted:#9fb0a6;--line:#2b3a31;
  --ok:#7cc39a;--ok-soft:#173323;--danger:#e59a9a;--danger-soft:#3a1717;--warn:#e8c37a;--warn-soft:#3a2e12;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Nunito,system-ui,sans-serif;padding-bottom:40px}
button,input{font:inherit;color:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--verde);color:#fff;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:3px solid var(--amarillo)}
header .t1{font-size:12px;font-weight:800;letter-spacing:.6px;opacity:.85}
header h1{margin:2px 0 0;font-size:21px;font-weight:800}
header .sub{font-size:13.5px;opacity:.92}
.prog{margin-top:8px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.prog span{display:block;height:100%;background:var(--amarillo);transition:width .3s}
.ptxt{display:flex;justify-content:space-between;font-size:13px;margin-top:4px;font-weight:700}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px 0}
.aviso{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.aviso.dng{background:var(--danger-soft);color:var(--danger)}
.bar{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.bar .sp{flex:1}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.sig{border:2px solid var(--verde-claro);box-shadow:0 4px 14px rgba(2,105,55,.18)}
.card.ok{opacity:.75}
.card.no{border-color:var(--danger)}
.hd{display:flex;gap:10px;align-items:flex-start}
.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.card.ok .n{background:var(--verde-claro)}
.card.no .n{background:var(--danger)}
.nom{font-weight:800;font-size:17px;line-height:1.25}
.dir{color:var(--muted);font-size:14.5px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;margin:4px 4px 0 0;background:var(--surface-2)}
.tag.sig{background:var(--amarillo);color:#3b2a00}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--danger-soft);color:var(--danger)}
.tag.vent{background:var(--warn-soft);color:var(--warn)}
.obs{margin-top:8px;background:rgba(246,198,91,.28);border-left:4px solid var(--amarillo);border-radius:6px;padding:6px 10px;font-weight:700;font-style:italic}
.its{margin:8px 0 0;padding:0;list-style:none;border-top:1px dashed var(--line)}
.its li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:15px}
.its b{font-weight:800}
.its .q{white-space:nowrap;font-weight:800}
.tot{display:flex;justify-content:space-between;margin-top:6px;font-weight:800}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-height:46px}
.btn.maps{background:#1a73e8;border-color:#1a73e8;color:#fff;flex:1 1 100%}
.btn.okb{background:var(--verde);border-color:var(--verde);color:#fff;flex:1}
.btn.nob{flex:1;color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.motivos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.motivos input{flex:1 1 100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.done{margin-top:8px;font-weight:800}
.done.ok{color:var(--ok)} .done.no{color:var(--danger)}
.fin{background:var(--surface-2);border:2px dashed var(--verde-claro)}
.vacio{text-align:center;color:var(--muted);padding:40px 10px}
.pie{text-align:center;color:var(--muted);font-size:12.5px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="t1">GRUPO CTS · AVIGURI · REPARTO</div>
  <h1 id="hNom">Cargando…</h1>
  <div class="sub" id="hSub"></div>
  <div class="prog"><span id="pBar" style="width:0"></span></div>
  <div class="ptxt"><span id="pTxt"></span><span id="pRest"></span></div>
</header>
<div class="wrap">
  <div id="avisos"></div>
  <div class="bar" id="bar" hidden><button class="btn sm" id="irSig">Ir a la próxima</button><span class="sp"></span><label class="chk"><input type="checkbox" id="ocultar"> Ocultar las ya hechas</label></div>
  <div id="lista"><div class="vacio">Cargando el reparto…</div></div>
  <div class="pie" id="pie"></div>
</div>
<script>
(function(){
"use strict";
const APP_URL="https://script.google.com/macros/s/AKfycbwCWHtCZkj1Wqdk6oHxp831mWu6SvHEOHBcn-NGKCvdhIC0o5k1gh9tBSqGe4TkLeqXWg/exec";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$ "+Math.round(n||0).toLocaleString("es-AR");
const hhmm=t=>new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false});
const token=new URLSearchParams(location.hash.slice(1)).get("t")||"";
const QK="pc_q_"+token,OK_K="pc_oc";
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const R={datos:null,estado:{},nombre:"",fecha:"",abierto:null,error:""};
let cola=ls.get(QK,[]);   // marcas que todavía no llegaron a la planilla (sin señal)
$("#ocultar").checked=!!ls.get(OK_K,false);

async function call(a,p){
  const r=await fetch(APP_URL,{method:"POST",body:JSON.stringify(Object.assign({a,t:token},p||{}))});
  const j=await r.json();if(!j.ok){const e=new Error(j.error||"Error");e.codigo=j.codigo;throw e}return j;
}
// Estado que se muestra: lo de la planilla más lo que está en la cola sin enviar.
function estadoVisto(){const e=Object.assign({},R.estado);for(const m of cola){if(m.e)e[m.id]={e:m.e,t:m.hora,nota:m.nota,pend:true};else delete e[m.id]}return e}
async function cargar(silencioso){
  if(!token){R.error="Falta el código del reparto en el link. Pedile el link a la oficina.";render();return}
  try{const j=await call("reparto");R.datos=j.datos;R.estado=j.estado||{};R.nombre=j.nombre;R.fecha=j.fecha;R.error="";if(!R.abierto)render()}   // no pisa el motivo que se está escribiendo
  catch(e){if(e.codigo==="link"){R.error=e.message;R.datos=null}else if(!silencioso&&!R.datos)R.error="No se pudo cargar el reparto. Revisá la señal y tocá recargar.";render()}
}
async function enviarCola(){
  while(cola.length){const m=cola[0];
    try{const j=await call("marcar",{id:m.id,e:m.e,nota:m.nota||"",hora:m.hora});R.estado=j.estado||R.estado;cola.shift();ls.set(QK,cola)}
    catch(e){if(e.codigo==="link"){cola=[];ls.set(QK,cola);R.error=e.message}break}}
  render();
}
function marcar(id,e,nota){cola=cola.filter(m=>m.id!==id);cola.push({id,e,nota:nota||"",hora:Date.now()});ls.set(QK,cola);R.abierto=null;render();enviarCola()}

function mapsUrl(p){const dest=p.lat!=null&&!p.aprox?`${p.lat},${p.lon}`:[p.dir,p.ciu,"Argentina"].filter(Boolean).join(", ");
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(dest)}
const telUrl=t=>{const d=String(t||"").replace(/[^\d+]/g,"");return d.length>=6?"tel:"+d:""};

function render(){
  const av=[];if(R.error)av.push(`<div class="aviso dng">${esc(R.error)}</div>`);
  if(cola.length)av.push(`<div class="aviso">Sin señal: ${cola.length} marca${cola.length>1?"s":""} se enviará${cola.length>1?"n":""} cuando vuelva la conexión.</div>`);
  $("#avisos").innerHTML=av.join("");
  const d=R.datos;if(!d){$("#lista").innerHTML=R.error?"":`<div class="vacio">Cargando el reparto…</div>`;$("#bar").hidden=true;return}
  const ps=d.paradas||[],E=estadoVisto();const hechas=ps.filter(p=>E[p.id]).length;const sig=ps.find(p=>!E[p.id]);
  $("#hNom").textContent=`${d.camion||R.nombre}${d.dep?" · "+d.dep.nombre:""}`;
  $("#hSub").textContent=`${d.fechaTxt||R.fecha} · ${ps.length} cliente${ps.length===1?"":"s"}${d.tot?` · ${d.tot.caj} CAJ · ${money(d.tot.imp)}`:""}${d.salida?` · sale ${d.salida}`:""}`;
  $("#pBar").style.width=(ps.length?hechas/ps.length*100:0)+"%";
  $("#pTxt").textContent=`${hechas} de ${ps.length} hechas`;
  const noEnt=ps.filter(p=>E[p.id]&&E[p.id].e==="no").length;$("#pRest").textContent=noEnt?`${noEnt} sin entregar`:sig?"":"¡Terminado!";
  $("#bar").hidden=!ps.length;$("#irSig").hidden=!sig;
  const oc=$("#ocultar").checked;
  const cards=ps.map((p,i)=>{const m=E[p.id];if(m&&oc)return "";const esSig=sig&&sig.id===p.id;
    const tel=telUrl(p.tel);
    const its=(p.items||[]).map(it=>`<li><span><b>${esc(it.c)}</b>${it.d&&it.d!==it.c?` <span class="dir">${esc(it.d)}</span>`:""}</span><span class="q">${esc(it.q)}</span></li>`).join("");
    const estadoHtml=m?`<div class="done ${m.e}">${m.e==="ok"?"✓ Entregado":"✗ No entregado"} · ${hhmm(m.t)}${m.nota?" · "+esc(m.nota):""}${m.pend?" · sin enviar":""} <button class="btn sm" data-undo="${esc(p.id)}">Deshacer</button></div>`:"";
    const motivos=R.abierto===p.id?`<div class="motivos">${["Cerrado","No estaba","No lo quiso","Sin dinero","No llegué"].map(x=>`<button class="btn sm" data-mot="${esc(x)}" data-id="${esc(p.id)}">${x}</button>`).join("")}<input id="motTxt" placeholder="Otro motivo (opcional)"><button class="btn sm nob" data-mot="" data-id="${esc(p.id)}">Confirmar sin entregar</button><button class="btn sm" data-cancel>Cancelar</button></div>`:"";
    return `<div class="card${esSig?" sig":""}${m?" "+m.e:""}" id="p_${esc(p.id)}">
      <div class="hd"><div class="n">${i+1}</div><div style="flex:1;min-width:0">
        <div class="nom">${esc(p.nom)}</div>
        <div class="dir">${esc([p.dir,p.ciu].filter(Boolean).join(", "))}</div>
        <div>${esSig?'<span class="tag sig">PRÓXIMA</span>':""}${p.lle?`<span class="tag">Llega ~${esc(p.lle)}</span>`:""}${p.vent?`<span class="tag vent">Recibe ${esc(p.vent)}</span>`:""}${p.aprox?'<span class="tag">Ubicación aproximada</span>':""}</div>
      </div></div>
      ${p.obs?`<div class="obs">${esc(p.obs)}</div>`:""}
      ${its?`<ul class="its">${its}</ul>`:""}
      <div class="tot"><span>${p.caj!=null?esc(p.caj)+" CAJ":""}</span><span>${p.imp!=null?money(p.imp):""}</span></div>
      ${m?estadoHtml:`<div class="acts"><a class="btn maps" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">📍 Ir con Google Maps</a>${tel?`<a class="btn" href="${esc(tel)}">📞 Llamar</a>`:""}<button class="btn okb" data-ok="${esc(p.id)}">✓ Entregado</button><button class="btn nob" data-no="${esc(p.id)}">✗ No entregado</button></div>${motivos}`}
    </div>`}).join("");
  const dep=d.dep;const fin=dep?`<div class="card fin"><div class="hd"><div class="n">🏁</div><div style="flex:1"><div class="nom">Volver al depósito ${esc(dep.nombre)}</div><div class="dir">${sig?"Después de la última entrega":"Recorrido terminado"}${d.vuelta?" · vuelta estimada "+esc(d.vuelta):""}</div></div></div>
    <div class="acts"><a class="btn maps" href="${esc(mapsUrl({lat:dep.lat,lon:dep.lon}))}" target="_blank" rel="noopener">📍 Volver con Google Maps</a></div></div>`:"";
  $("#lista").innerHTML=(cards||(ps.length?`<div class="vacio">Todas las entregas están hechas.</div>`:`<div class="vacio">Este camión no tiene entregas asignadas.</div>`))+fin;
  $("#pie").textContent=`Actualizado ${hhmm(Date.now())} · se actualiza solo`;
}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.ok){marcar(t.dataset.ok,"ok");return}
  if(t.dataset.no){R.abierto=t.dataset.no;render();const i=$("#motTxt");if(i)i.focus();return}
  if(t.hasAttribute("data-mot")){const txt=($("#motTxt")&&$("#motTxt").value.trim())||"";marcar(t.dataset.id,"no",[t.dataset.mot,txt].filter(Boolean).join(" · "));return}
  if(t.hasAttribute("data-cancel")){R.abierto=null;render();return}
  if(t.dataset.undo){marcar(t.dataset.undo,"");return}
  if(t.id==="irSig"){const E=estadoVisto();const p=(R.datos.paradas||[]).find(x=>!E[x.id]);const el=p&&document.getElementById("p_"+p.id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
});
$("#ocultar").addEventListener("change",e=>{ls.set(OK_K,e.target.checked);render()});
window.addEventListener("online",enviarCola);
cargar().then(enviarCola);
setInterval(()=>{if(document.hidden)return;if(cola.length)enviarCola();cargar(true)},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(cola.length)enviarCola();cargar(true)}});
})();
</script>
</body>
</html>
